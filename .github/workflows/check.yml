name: Check translations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted runner only: pull requests from forks must never run on a self-hosted machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py
